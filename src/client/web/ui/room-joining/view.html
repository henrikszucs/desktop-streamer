<dialog class="" id="dialog-room-joining">
    <nav>
        <h5 data-localization="new.join.dialog-title">Joining...</h5>
        <div class="max"></div>
        <button class="circle transparent" id="btn-room-joining-close">
            <i>close</i>
        </button>
    </nav>
    <div class="no-border">
        <p id="dialog-room-joining-info">Establishing connection to host device as <span class="bold">Guest</span> from <span class="bold">192.168.0.1</span> ip address. Please wait...</p>
        <progress min="0" max="10000" id="room-joining-progress"></progress>
    </div>
</dialog>
