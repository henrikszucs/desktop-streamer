<!--
    The room as the peer sees it: the stream, and one bar under it. The bar is
    built here as far as its shape goes - what each entry offers is data in
    ./index.js, so the two menus are filled at mount rather than written out
    twice. See .claude/CLIENT.md.
-->
<div class="room-layout hide" id="screen-room">
    <!--
        The stage is a canvas and not a <video>: the stream arrives as frames
        this client decodes itself, and the decoder's worker draws them here
        straight from the GPU - see .claude/CLIENT.md, "The stream". It is one
        element for the life of the screen, since its surface is handed to that
        worker once.
    -->
    <!--
        The stage is what goes fullscreen - the picture and nothing else - and
        it carries the one thing drawn over the picture: the ring that fills
        while the exit shortcut is held, so a five second hold under the
        desktop shell reads as a wait and not as a key that does nothing.
    -->
    <!--
        It also carries the host's own mouse pointer: the picture arrives with
        no cursor in it, and the one over the canvas here is an image the host
        sent once and this machine moves - so it is drawn at this screen's rate
        and not at the stream's. See ./index.js and src/room/cursor.js.
    -->
    <div id="room-stage">
        <canvas id="room-canvas" tabindex="0"></canvas>
        <img class="room-cursor hide" id="room-cursor" alt="" draggable="false">
        <div class="room-exit-ring hide" id="room-exit-ring"></div>
    </div>

    <!--
        Three columns rather than one row: the tools stay in the middle of the
        window whatever the leaving button beside them is worth in pixels.
    -->
    <nav class="room-bar tiny-space">
        <div class="room-bar-side">
            <!--
                What is carrying the room, and the switch between the two
                paths: through the server (lit - a click tries the direct path
                again), direct (plain - a click moves onto the server), or
                direct with no relay for this user (disabled, and the tooltip
                says so) - see ./index.js.
            -->
            <button class="chip small-round border" id="btn-room-relay">
                <i id="btn-room-relay-icon">cloud</i>
                <span data-localization="room.relay.label">Relay</span>
                <div class="tooltip right" id="btn-room-relay-tooltip" data-localization="room.relay.on">The two devices could not reach each other, so the connection goes through the server.</div>
            </button>
            <!--
                What the line is doing, once a second: frames drawn and bits
                received. It is the one reading that says whether a picture
                that looks wrong is the line's fault or the host's. Two short
                lines rather than one long one, so it fits beside the chip.
            -->
            <span class="room-stats" id="room-stats">
                <span id="room-stats-rate"></span>
                <span id="room-stats-line"></span>
            </span>
        </div>
        <nav class="toolbar">
            <a tabindex="0" id="btn-room-audio">
                <i id="btn-room-audio-icon">volume_up</i>
                <div class="tooltip" id="btn-room-audio-tooltip" data-localization="room.audio.mute">Mute the sound</div>
            </a>
            <a tabindex="0" id="btn-room-control">
                <i id="btn-room-control-icon">hand_gesture_off</i>
                <div class="tooltip" id="btn-room-control-tooltip" data-localization="room.control.take">Take the keyboard and the mouse</div>
            </a>
            <!--
                Whether the two machines share one clipboard: what is copied
                here goes over when the picture is clicked back into, and what
                is copied there lands here - see ./index.js and
                src/room/clipboard.js. Greyed when the host has no clipboard to
                share, or this browser will not hand the page one.
            -->
            <a tabindex="0" id="btn-room-clipboard">
                <i id="btn-room-clipboard-icon">content_paste_off</i>
                <div class="tooltip" id="btn-room-clipboard-tooltip" data-localization="room.clipboard.share">Share the clipboard</div>
            </a>
            <!--
                The line first and the picture after it: the bandwidth is what
                the resolutions are priced against, so what it is set to is what
                the menu below can offer at all - see the cap in ./index.js.
            -->
            <a tabindex="0" id="btn-room-bandwidth">
                <i>speed</i>
                <span id="room-bandwidth-label">8 Mbps</span>
                <menu class="border top no-wrap" id="room-bandwidth-menu"></menu>
            </a>
            <!--
                Which of the host's displays the picture is of. Only there when
                the host has more than one: the entry is filled from what the
                host says it has (the stream's "share" event), never guessed.
            -->
            <a tabindex="0" class="hide" id="btn-room-screen">
                <i>monitor</i>
                <span id="room-screen-label"></span>
                <menu class="border top no-wrap" id="room-screen-menu"></menu>
            </a>
            <a tabindex="0" id="btn-room-resolution">
                <i>aspect_ratio</i>
                <span id="room-resolution-label">Auto</span>
                <menu class="border top no-wrap" id="room-resolution-menu"></menu>
            </a>
            <!--
                How many pictures a second, priced by nothing: the bandwidth
                is spent on sharpness first, and the encoder shares what is
                left across the frames asked for - see ./index.js.
            -->
            <a tabindex="0" id="btn-room-framerate">
                <i>animation</i>
                <span id="room-framerate-label">30 fps</span>
                <menu class="border top no-wrap" id="room-framerate-menu"></menu>
            </a>
            <!--
                What this client does to the picture once it has arrived:
                the enhancements the decoder's worker runs over it (upscale,
                frame interpolation, frame extrapolation - src/room/
                stream-enhance.js), any number of them at once. Its rows are
                filled in ./index.js, and the last of them is a reading
                rather than a choice: which GPU backend runs them and what a
                frame costs. Greyed, with the reason in its rows, on a browser
                with neither WebGPU nor WebGL.
            -->
            <a tabindex="0" id="btn-room-enhance">
                <i>auto_awesome</i>
                <span id="room-enhance-label">Off</span>
                <menu class="border top no-wrap" id="room-enhance-menu"></menu>
            </a>
            <a tabindex="0" id="btn-room-fullscreen">
                <i id="btn-room-fullscreen-icon">fullscreen</i>
                <div class="tooltip" id="btn-room-fullscreen-tooltip" data-localization="room.fullscreen.enter">Fullscreen</div>
            </a>
        </nav>
        <div class="room-bar-side room-bar-end">
            <button class="circle extra error" id="btn-room-leave">
                <i>close</i>
                <div class="tooltip left" data-localization="room.leave.tooltip">Leave the room</div>
            </button>
        </div>
    </nav>
</div>
