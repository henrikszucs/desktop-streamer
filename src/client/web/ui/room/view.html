<!--
    The room as the peer sees it: the stream, and one bar under it. The bar is
    built here as far as its shape goes - what each entry offers is data in
    ./index.js, so the two menus are filled at mount rather than written out
    twice. See .claude/CLIENT.md.
-->
<div class="room-layout hide" id="screen-room">
    <div>
        <video id="room-video" playsinline></video>
    </div>

    <!--
        Three columns rather than one row: the tools stay in the middle of the
        window whatever the leaving button beside them is worth in pixels.
    -->
    <nav class="room-bar tiny-space">
        <div class="room-bar-side">
            <!--
                Only there when it is true: a connection that goes through the
                server is slower than one that does not, and the room is the one
                place where that is worth knowing without being asked.
            -->
            <div class="chip small-elevate hide" id="room-relay">
                <i>cloud</i>
                <span data-localization="room.relay.label">Relay</span>
                <div class="tooltip right" data-localization="room.relay.tooltip">The two devices could not reach each other, so the connection goes through the server.</div>
            </div>
        </div>
        <nav class="toolbar">
            <a tabindex="0" id="btn-room-audio">
                <i id="btn-room-audio-icon">volume_up</i>
                <div class="tooltip" id="btn-room-audio-tooltip" data-localization="room.audio.mute">Mute the sound</div>
            </a>
            <a tabindex="0" id="btn-room-control">
                <i id="btn-room-control-icon">hand_gesture_off</i>
                <div class="tooltip" id="btn-room-control-tooltip" data-localization="room.control.take">Take the keyboard and the mouse</div>
            </a>
            <!--
                The line first and the picture after it: the bandwidth is what
                the resolutions are priced against, so what it is set to is what
                the menu below can offer at all - see the cap in ./index.js.
            -->
            <a tabindex="0" id="btn-room-bandwidth">
                <i>speed</i>
                <span id="room-bandwidth-label">8 Mbps</span>
                <menu class="border top no-wrap" id="room-bandwidth-menu"></menu>
            </a>
            <a tabindex="0" id="btn-room-resolution">
                <i>aspect_ratio</i>
                <span id="room-resolution-label">Auto</span>
                <menu class="border top no-wrap" id="room-resolution-menu"></menu>
            </a>
            <a tabindex="0" id="btn-room-fullscreen">
                <i id="btn-room-fullscreen-icon">fullscreen</i>
                <div class="tooltip" id="btn-room-fullscreen-tooltip" data-localization="room.fullscreen.enter">Fullscreen</div>
            </a>
        </nav>
        <div class="room-bar-side room-bar-end">
            <button class="circle extra error" id="btn-room-leave">
                <i>close</i>
                <div class="tooltip left" data-localization="room.leave.tooltip">Leave the room</div>
            </button>
        </div>
    </nav>
</div>
