<!DOCTYPE html>
<!--
    The Google button in a page of its own, framed by the login screen - see
    google-frame.js. Not a UI module: nothing in the registry names it.
-->
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Google</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: transparent;
            overflow: hidden;
        }
        #google-button {
            display: inline-block;
        }
    </style>
    <script type="module" src="/ui/management/login/google-frame.js"></script>
</head>
<body>
    <div id="google-button"></div>
</body>
</html>
