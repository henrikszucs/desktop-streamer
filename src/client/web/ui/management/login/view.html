<div class="hide" id="screen-login">
    <h5 data-localization="login.title">Log in to your account</h5>
    <div class="space"></div>
    <div class="center-align" id="google-login"></div>
    <!--
        Nothing to sign in with. The route is still reachable - by URL, and by
        the button of a guest notice on another screen - so it says whose
        decision that was instead of showing an empty screen.
    -->
    <article class="border round center-align hide" id="login-disabled">
        <i>lock</i>
        <div data-localization="main.authDisabled">The administrator disabled authentication</div>
    </article>
    <!-- a provider is configured, but the button could not be loaded -->
    <article class="border round center-align hide" id="login-unavailable">
        <i>cloud_off</i>
        <div data-localization="login.unavailable">Sign-in is not available right now</div>
        <div class="space"></div>
        <button class="border" id="login-retry">
            <i>refresh</i>
            <span data-localization="login.retry">Try again</span>
        </button>
    </article>
</div>
