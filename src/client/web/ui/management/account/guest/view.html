<div class="hide" id="account-guest">
    <h5 class="small-margin" data-localization="account.guest.title">Guest</h5>
    <div class="small-margin">
        <p data-localization="account.guest.hint">The guest is this device alone. The name is kept here and reaches no server; signing out forgets it with everything else.</p>
        <div class="field label border round">
            <input type="text" id="account-guest-name" maxlength="64"/>
            <label data-localization="account.guest.name">Name</label>
        </div>
        <nav class="right-align">
            <button id="btn-account-guest-save">
                <i>check</i>
                <span data-localization="account.guest.save">Save</span>
            </button>
        </nav>
    </div>
</div>
