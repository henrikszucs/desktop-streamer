<div class="hide" id="account-information">
    <h5 class="small-margin" data-localization="account.information.title">Information</h5>
    <div class="small-margin">
        <fieldset>
            <legend data-localization="account.information.account-data">Account data</legend>
            <nav class="wrap">
                <div class="field label border round information-box">
                    <input type="text" id="account-email" disabled/>
                    <label data-localization="account.information.email">Email</label>
                </div>
                <div class="field label border round information-box">
                    <input type="text" id="account-firstname" disabled/>
                    <label data-localization="account.information.first-name">First name</label>
                </div>
                <div class="field label border round information-box">
                    <input type="text" id="account-lastname" disabled/>
                    <label data-localization="account.information.last-name">Last name</label>
                </div>
            </nav>
        </fieldset>
    </div>
</div>
