<dialog class="multicolumn-dialog" id="dialog-account-settings">
    <nav>
        <h5 data-localization="account.title">Account settings</h5>
        <div class="max"></div>
        <button class="circle transparent" id="btn-account-close">
            <i>close</i>
        </button>
    </nav>
    <div class="no-border">
        <!--
            One column for either user. A button names the user it is for with
            data-user, and open() in ./index.js shows the buttons of the user
            this client is: the guest has a name and a way to be forgotten, an
            account has the rest.
        -->
        <div>
            <button class="primary small-margin" id="btn-account-information" data-user="account" data-window="information">
                <i>info</i>
                <span class="l m" data-localization="account.information.btn">Information</span>
            </button>
            <button class="fill small-margin" id="btn-account-sessions" data-user="account" data-window="sessions">
                <i>devices</i>
                <span class="l m" data-localization="account.sessions.btn">Sessions</span>
            </button>
            <button class="fill small-margin" id="btn-account-delete" data-user="account" data-window="delete">
                <i>delete</i>
                <span class="l m" data-localization="account.delete.btn">Delete</span>
            </button>
            <button class="primary small-margin hide" id="btn-account-guest" data-user="guest" data-window="guest">
                <i>person</i>
                <span class="l m" data-localization="account.guest.btn">Guest</span>
            </button>
            <button class="fill small-margin hide" id="btn-account-reset" data-user="guest" data-window="reset">
                <i>delete</i>
                <span class="l m" data-localization="account.delete.btn">Delete</span>
            </button>
        </div>
        <div id="account-windows"></div>
    </div>
</dialog>
