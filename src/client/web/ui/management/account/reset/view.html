<div class="hide" id="account-reset">
    <h5 class="small-margin" data-localization="account.reset.title">Delete guest</h5>
    <div class="small-margin">
        <p data-localization="account.reset.warning">The guest has no account to delete: what is deleted is what this device keeps for it - the name and every remembered connection. It is the same as signing out, and nothing brings it back.</p>
        <nav class="right-align">
            <button class="error" id="btn-account-reset-confirm">
                <i>delete</i>
                <span data-localization="account.reset.confirm">Delete local data</span>
            </button>
        </nav>
    </div>
</div>
