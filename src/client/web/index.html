<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <meta name="description" content="A simple web interface for controlling your desktop remotly."/>
        <meta name="keywords" content="desktop, streamer, remote, access"/>
        <title>Desktop Streamer</title>
        <link href="/media/icon.svg" rel="icon"  type="image/svg+xml"/>

        <link href="/libs/beercss/beer.min.css" rel="stylesheet"/>
        <script src="/libs/beercss/beer.min.js" type="module" async></script>
        <script src="/libs/beercss/material-dynamic-colors.min.js" type="module" async></script>

        <link href="/index.css" rel="stylesheet"/>
        <script src="/index.js" type="module" async></script>

    </head>
    <body>
        <!--
            The four elements the application is built on top of, and nothing
            else. Every bar, screen and dialog - the two navigation bars
            included - is a UI module under /ui that ui/ui.js mounts into one of
            them at runtime, see src/registry.js.

            What stays here is what has to exist before the first module can be
            fetched: the overlay a dialog is shown over, the loading layer,
            which is on screen from the first paint rather than from the first
            script, and one surface per segment of the shell - the layers the
            three folders of /ui are named after.

            A surface carries its own [data-segment]: the router puts the open
            segment's surface and chrome on screen and takes the other one off,
            so the two never share the window. The management one starts on
            screen and the room one starts hidden, which is the segment the
            shell boots into.
        -->

        <!-- The shared overlay, under every dialog and over everything else -->
        <div class="overlay blur active" id="dialog-overlay"></div>

        <!--
            The loading layer, over both segments of the shell and starting on
            screen: the connection holds it from boot until the server answers
            and takes it back the moment it drops, so a client that is not
            talking to a server is never showing one it cannot use. ui/loading/
            loading.js names every holder, and the layer is up while any of
            them holds it.
        -->
        <dialog class="active" id="dialog-loading">
            <h5 data-localization="loading.title">Loading...</h5>
            <br>
            <div data-localization="loading.subtitle">The application is loading please wait...</div>
            <br>
            <progress></progress>
        </dialog>

        <!--
            The surface the management screens are mounted into. beercss lays
            the body out as a grid of named areas, so a bar mounted after this
            one still lands around it.
        -->
        <main class="surface-container round padding bottom-margin center-align" id="screen-main" data-segment="management">
        </main>

        <!--
            The surface of the other segment, the room: the stream and the
            toolbar over it, no chrome around them. It is the same grid area as
            the management surface above - one of the two is always hidden - so
            the room takes the whole window once the bars are off screen.
        -->
        <main class="hide" id="room-main" data-segment="room">
        </main>
    </body>
</html>
